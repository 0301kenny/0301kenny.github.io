<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>示意圖預覽</title>
<style>
  body { margin: 0; padding: 32px 16px; background: #EDECE8; font-family: 'Noto Sans TC', 'PingFang TC', sans-serif; color: #2E2E2D; }
  h2 { font-size: 15px; font-weight: 500; margin: 32px 0 12px; }
  .wide img { width: 100%; max-width: 1200px; height: auto; display: block; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .phones { display: flex; gap: 24px; flex-wrap: wrap; }
  .phones img { width: 300px; max-width: 100%; height: auto; border-radius: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.12); }
</style>
</head>
<body>
  <h2>UI Spec 規格瀏覽工具</h2>
  <div class="wide"><img src="uispec-overview.svg" alt="UI Spec 規格瀏覽工具示意圖"></div>
  <h2>LINE LIFF 訂房</h2>
  <div class="phones">
    <img src="liff-home.svg" alt="LIFF 首頁示意圖">
    <img src="liff-room-list.svg" alt="LIFF 房型列表示意圖">
  </div>
</body>
</html>
